# Cornea shaders.properties

iris.features.optional = CUSTOM_IMAGES ENTITY_TRANSLUCENT

clouds = off
sun = false
moon = false
oldLighting = false
oldHandLight = false
dynamicHandLight = true
separateAo = true
underwaterOverlay = false
vignette = false
rain.depth = false
shadowPlayer = true
shadowTerrain = true
shadowTranslucent = true
shadowBlockEntities = true

#ifdef ENTITY_SHADOWS
shadowEntities = true
#else
shadowEntities = false
#endif

#ifdef COLORED_LIGHTS
shadow.culling = reversed
#endif

texture.noise = image/noise.png

# -------------------------------------------------------------- Buffers
size.buffer.colortex4 = 193 108
size.buffer.colortex5 = 0.5 0.5
size.buffer.colortex6 = 0.5 0.5
size.buffer.colortex7 = 0.5 0.5
size.buffer.colortex9 = 0.5 0.5
size.buffer.colortex10 = 0.5 0.5

# -------------------------------------------------------------- Coloured light volumes
#ifdef COLORED_LIGHTS
#if VOXEL_SIZE == 64
image.voxelImg = voxelSampler red_integer r8ui unsigned_byte true false 64 64 64
image.lightImgA = lightSamplerA rgba rgba16f half_float false false 64 64 64
image.lightImgB = lightSamplerB rgba rgba16f half_float false false 64 64 64
#elif VOXEL_SIZE == 128
image.voxelImg = voxelSampler red_integer r8ui unsigned_byte true false 128 128 128
image.lightImgA = lightSamplerA rgba rgba16f half_float false false 128 128 128
image.lightImgB = lightSamplerB rgba rgba16f half_float false false 128 128 128
#else
image.voxelImg = voxelSampler red_integer r8ui unsigned_byte true false 96 96 96
image.lightImgA = lightSamplerA rgba rgba16f half_float false false 96 96 96
image.lightImgB = lightSamplerB rgba rgba16f half_float false false 96 96 96
#endif
#endif

# -------------------------------------------------------------- Player interaction map
image.interactImgA = interactSamplerA rgba rgba16f half_float false false 256 256
image.interactImgB = interactSamplerB rgba rgba16f half_float false false 256 256
image.waterFlagImg = waterFlagSampler red_integer r32ui unsigned_int false false 1 1

# -------------------------------------------------------------- Program toggles
program.world0/shadowcomp1.enabled = SNOW_INTERACTION || WATER_RIPPLES
program.world0/shadowcomp.enabled = COLORED_LIGHTS
program.world0/deferred.enabled = SSAO
program.world0/deferred1.enabled = CLOUDS
program.world0/deferred2.enabled = CLOUDS

program.world-1/shadow.enabled = COLORED_LIGHTS
program.world-1/shadowcomp.enabled = COLORED_LIGHTS
program.world-1/deferred.enabled = SSAO
program.world-1/prepare.enabled = false
program.world-1/deferred1.enabled = false
program.world-1/deferred2.enabled = false
program.world-1/composite.enabled = false

#if defined SHADOWS || defined COLORED_LIGHTS
program.world1/shadow.enabled = true
#else
program.world1/shadow.enabled = false
#endif
program.world1/shadowcomp.enabled = COLORED_LIGHTS
program.world1/deferred.enabled = SSAO
program.world1/prepare.enabled = false
program.world1/deferred1.enabled = false
program.world1/deferred2.enabled = false
program.world1/composite.enabled = false

# Separate translucent entity/particle draws only exist from MC 26.1
#if MC_VERSION < 260100
program.world0/gbuffers_entities_translucent.enabled = false
program.world0/gbuffers_block_translucent.enabled = false
program.world0/gbuffers_particles_translucent.enabled = false
program.world-1/gbuffers_entities_translucent.enabled = false
program.world-1/gbuffers_block_translucent.enabled = false
program.world-1/gbuffers_particles_translucent.enabled = false
program.world1/gbuffers_entities_translucent.enabled = false
program.world1/gbuffers_block_translucent.enabled = false
program.world1/gbuffers_particles_translucent.enabled = false
#endif

# -------------------------------------------------------------- Blending
# Deferred programs write packed data: never blend
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_hand = off
blend.gbuffers_textured = off
blend.gbuffers_textured_lit = off
blend.gbuffers_particles = off
blend.gbuffers_basic = off
blend.gbuffers_line = off
blend.shadow = off

# Translucents: premultiplied alpha into colortex2, data in colortex3 unblended
blend.gbuffers_water = off
blend.gbuffers_water.colortex2 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water = off
blend.gbuffers_hand_water.colortex2 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_damagedblock = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Additive glow
blend.gbuffers_spidereyes = ONE ONE ZERO ONE
blend.gbuffers_armor_glint = ONE ONE ZERO ONE
blend.gbuffers_lightning = ONE ONE ZERO ONE

alphaTest.gbuffers_terrain = off
alphaTest.gbuffers_entities = off
alphaTest.gbuffers_hand = off
alphaTest.gbuffers_block = off
alphaTest.gbuffers_textured = off
alphaTest.gbuffers_particles = off
alphaTest.gbuffers_water = off
alphaTest.gbuffers_hand_water = off
alphaTest.gbuffers_weather = off
alphaTest.shadow = off

# -------------------------------------------------------------- Menu
screen = <profile> <empty> [SHADOWS_MENU] [LIGHTING_MENU] [SKY_MENU] [FOG_MENU] [MATERIALS_MENU] [WATER_MENU] [POST_MENU] [MISC_MENU]

screen.SHADOWS_MENU = SHADOWS SHADOW_MODE PIXEL_SHADOW_RES SHADOW_SAMPLES_LOW <empty> [SHADOWS_ADV]
screen.SHADOWS_ADV = SHADOW_RES shadowDistance SHADOW_SAMPLES SHADOW_PCSS SHADOW_SOFTNESS COLORED_SHADOWS SHADOW_DISTORTION ENTITY_SHADOWS sunPathRotation
screen.LIGHTING_MENU = SUN_INTENSITY SKY_INTENSITY BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMP COLORED_LIGHTS TORCH_SHADOWS TORCH_SHADOW_STEPS VOXEL_SIZE COLORED_LIGHT_SATURATION HANDHELD_LIGHT EMISSION_STRENGTH MIN_LIGHT SSAO AO_STRENGTH SSS SSS_STRENGTH EDGE_HIGHLIGHT EDGE_STRENGTH
screen.SKY_MENU = CLOUDS CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED CLOUD_SHADOWS ALTO_CLOUDS CIRRUS STARS AURORA AURORA_STRENGTH AURORA_STEPS END_BLACK_HOLE BLACK_HOLE_SIZE SUN_SIZE MOON_SIZE
screen.FOG_MENU = VL VL_STEPS VL_STRENGTH FOG_DENSITY BORDER_FOG
screen.MATERIALS_MENU = PBR_NORMALS NORMAL_STRENGTH REFLECTIVE_BLOCKS EMISSIVE_ORES EMISSION_STRENGTH <empty> [WEATHER_MENU]
screen.WEATHER_MENU = WET_SURFACES PUDDLES_LINGER RAIN_RIPPLES RAINBOW RAINBOW_STRENGTH SNOW_INTERACTION SNOW_RECOVERY
screen.WATER_MENU = WATER_WAVES WAVE_STRENGTH WATER_RIPPLES RIPPLE_STRENGTH WATER_SSR SSR_STEPS REFRACTION CAUSTICS CAUSTICS_STRENGTH UW_VL
screen.POST_MENU = TAA SHARPENING BLOOM BLOOM_STRENGTH AUTO_EXPOSURE EXPOSURE_BIAS SATURATION CONTRAST VIGNETTE
screen.MISC_MENU = WAVING_PLANTS WAVING_SPEED PLANT_INTERACTION

sliders = RAINBOW_STRENGTH RIPPLE_STRENGTH SNOW_RECOVERY SHADOW_RES PIXEL_SHADOW_RES SHADOW_SAMPLES_LOW SSS_STRENGTH EDGE_STRENGTH shadowDistance sunPathRotation SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION \
 SUN_INTENSITY SKY_INTENSITY BLOCKLIGHT_INTENSITY MIN_LIGHT EMISSION_STRENGTH AO_STRENGTH VOXEL_SIZE COLORED_LIGHT_SATURATION \
 CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED SUN_SIZE MOON_SIZE \
 VL_STEPS VL_STRENGTH FOG_DENSITY WAVE_STRENGTH SSR_STEPS CAUSTICS_STRENGTH NORMAL_STRENGTH TORCH_SHADOW_STEPS AURORA_STRENGTH AURORA_STEPS BLACK_HOLE_SIZE \
 SHARPENING BLOOM_STRENGTH EXPOSURE_BIAS SATURATION CONTRAST VIGNETTE WAVING_SPEED

# -------------------------------------------------------------- Profiles
# MEDIUM is the default (matches settings.glsl)
profile.LOW = SHADOW_MODE=0 SHADOW_RES=1024 shadowDistance=80.0 !SHADOW_PCSS SHADOW_SAMPLES=4 !SSAO !COLORED_LIGHTS \
 CLOUD_STEPS=8 CLOUD_LIGHT_STEPS=2 !CIRRUS VL_STEPS=4 !WATER_SSR !UW_VL VOXEL_SIZE=64
profile.MEDIUM = SHADOW_MODE=1 SHADOW_RES=2048 shadowDistance=112.0 SHADOW_PCSS SHADOW_SAMPLES=8 SSAO COLORED_LIGHTS \
 CLOUD_STEPS=12 CLOUD_LIGHT_STEPS=3 CIRRUS VL_STEPS=8 WATER_SSR UW_VL VOXEL_SIZE=96 SSR_STEPS=12
profile.HIGH = SHADOW_MODE=1 SHADOW_RES=2048 shadowDistance=128.0 SHADOW_PCSS SHADOW_SAMPLES=12 SSAO COLORED_LIGHTS \
 CLOUD_STEPS=18 CLOUD_LIGHT_STEPS=4 CIRRUS VL_STEPS=12 WATER_SSR UW_VL VOXEL_SIZE=128 SSR_STEPS=16
profile.ULTRA = SHADOW_MODE=1 SHADOW_RES=3072 shadowDistance=160.0 SHADOW_PCSS SHADOW_SAMPLES=16 SSAO COLORED_LIGHTS \
 CLOUD_STEPS=24 CLOUD_LIGHT_STEPS=6 CIRRUS VL_STEPS=16 WATER_SSR UW_VL VOXEL_SIZE=128 SSR_STEPS=24
